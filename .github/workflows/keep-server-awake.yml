name: Keep Render Server Awake

on:
  # GitHub Actions cron tối thiểu là 5 phút
  # Dùng loop bên trong job để ping mỗi 1 phút trong suốt 5 phút
  schedule:
    - cron: '*/5 * * * *'

  # Cho phép chạy thủ công từ GitHub UI
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Ping every minute for 5 minutes
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "❌ RENDER_SERVICE_URL chưa được cấu hình"
            echo "Vui lòng thêm secret RENDER_SERVICE_URL vào GitHub repository"
            echo "Ví dụ: https://saigon-match-api.onrender.com"
            exit 1
          fi

          # Ping 5 lần, mỗi lần cách nhau 60 giây → hiệu quả ping mỗi 1 phút
          for i in 1 2 3 4 5; do
            echo "────────────────────────────────────"
            echo "🔔 Ping #${i}/5 — $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            
            response=$(curl -s -w "\n%{http_code}" --max-time 10 "${RENDER_SERVICE_URL}/health")
            http_code=$(echo "$response" | tail -n 1)
            body=$(echo "$response" | head -n -1)

            echo "📊 HTTP Status : $http_code"
            echo "📦 Response    : $body"

            if [ "$http_code" = "200" ]; then
              echo "✅ OK"
            else
              echo "⚠️  Status $http_code — server có thể đang wake up..."
            fi

            # Chờ 60 giây trước lần ping tiếp theo (bỏ qua lần cuối)
            if [ "$i" -lt 5 ]; then
              sleep 60
            fi
          done

          echo "────────────────────────────────────"
          echo "🏁 Hoàn thành 5 lần ping."
